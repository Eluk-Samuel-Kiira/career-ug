<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13273D"/>
      <stop offset="0.55" stop-color="#13273D"/>
      <stop offset="1" stop-color="#0F5F57"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20AA3E"/>
      <stop offset="1" stop-color="#03A588"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- soft background shapes -->
  <circle cx="900" cy="170" r="210" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="170" r="140" fill="#5EE0C0" opacity="0.07"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- woman -->
  <!-- torso / blazer -->
  <path d="M770 400 C772 300 800 258 880 252 C960 258 988 300 990 400 Z" fill="url(#blazer)"/>
  <!-- blouse V -->
  <path d="M858 256 L880 312 L902 256 Z" fill="#ffffff"/>
  <!-- neck -->
  <rect x="866" y="214" width="28" height="44" rx="10" fill="#E9B894"/>
  <!-- head -->
  <circle cx="880" cy="186" r="46" fill="#F2C6A0"/>
  <!-- hair with bun -->
  <path d="M832 184 C828 128 858 114 882 114 C912 114 936 132 930 186 C924 160 910 150 880 150 C860 152 846 162 838 196 Z" fill="#2B1B12"/>
  <circle cx="886" cy="112" r="16" fill="#2B1B12"/>
  <!-- features -->
  <circle cx="866" cy="190" r="3" fill="#2B1B12"/>
  <circle cx="894" cy="190" r="3" fill="#2B1B12"/>
  <path d="M870 210 Q880 218 892 210" stroke="#B5543C" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- arms holding the resume -->
  <path d="M800 268 Q786 336 834 344" stroke="#20AA3E" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M960 268 Q974 336 926 344" stroke="#03A588" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- resume -->
  <g transform="rotate(-4 880 350)">
    <rect x="828" y="282" width="104" height="132" rx="6" fill="#ffffff"/>
    <rect x="828" y="282" width="104" height="22" rx="6" fill="#20AA3E"/>
    <rect x="840" y="318" width="60" height="6" rx="3" fill="#94A3B8"/>
    <rect x="840" y="332" width="80" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="840" y="342" width="72" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="840" y="352" width="80" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="840" y="368" width="60" height="6" rx="3" fill="#94A3B8"/>
    <rect x="840" y="382" width="76" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- hands -->
  <circle cx="834" cy="344" r="13" fill="#F2C6A0"/>
  <circle cx="926" cy="344" r="13" fill="#F2C6A0"/>

  <!-- check badge -->
  <circle cx="1010" cy="250" r="30" fill="#ffffff"/>
  <circle cx="1010" cy="250" r="24" fill="#20AA3E"/>
  <path d="M998 250 L1007 259 L1023 241" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
