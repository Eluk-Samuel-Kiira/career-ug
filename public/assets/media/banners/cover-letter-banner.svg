<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13273D"/>
      <stop offset="0.55" stop-color="#13273D"/>
      <stop offset="1" stop-color="#0F5F57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3FB5A5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3FB5A5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5F86"/>
      <stop offset="1" stop-color="#1B3F5E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2AE85"/>
      <stop offset="1" stop-color="#C98E66"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="880" cy="210" rx="240" ry="220" fill="url(#glow)"/>
  <circle cx="900" cy="170" r="210" fill="#ffffff" opacity="0.04"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- torso / suit jacket -->
  <path d="M772 400 C774 318 796 262 866 252 L894 252 C964 262 986 318 988 400 Z" fill="url(#suit)"/>

  <!-- shirt front -->
  <path d="M860 254 L880 330 L900 254 Z" fill="#FFFFFF"/>

  <!-- collar points -->
  <path d="M858 254 L874 262 L866 286 L848 276 Z" fill="#F8FAFC"/>
  <path d="M902 254 L886 262 L894 286 L912 276 Z" fill="#F8FAFC"/>

  <!-- lapels -->
  <path d="M856 252 L826 310 L846 318 L872 270 Z" fill="#243F5C"/>
  <path d="M904 252 L934 310 L914 318 L888 270 Z" fill="#243F5C"/>
  <path d="M856 252 L826 310" stroke="#3D6A92" stroke-width="2" fill="none"/>
  <path d="M904 252 L934 310" stroke="#3D6A92" stroke-width="2" fill="none"/>

  <!-- pocket square -->
  <path d="M822 300 L836 292 L846 304 L832 312 Z" fill="#20AA3E"/>
  <path d="M826 304 L836 296 L842 303 L832 310 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- tie -->
  <path d="M876 282 L884 282 L890 346 L880 358 L870 346 Z" fill="#03A588"/>
  <path d="M876 282 L884 282 L885 292 L875 292 Z" fill="#028A72"/>
  <path d="M877 300 L883 300 M878 314 L882 314" stroke="#5EE0C0" stroke-width="1.5" opacity="0.6"/>

  <!-- neck -->
  <path d="M866 212 L894 212 L896 254 L864 254 Z" fill="#C98E66"/>
  <path d="M866 232 Q880 240 894 232 L894 240 Q880 248 866 240 Z" fill="#B57B55" opacity="0.5"/>

  <!-- ears -->
  <ellipse cx="835" cy="190" rx="7" ry="11" fill="#D39A70"/>
  <ellipse cx="925" cy="190" rx="7" ry="11" fill="#D39A70"/>

  <!-- head -->
  <ellipse cx="880" cy="184" rx="45" ry="48" fill="url(#skin)"/>

  <!-- hair: short, side-parted, with volume -->
  <path d="M834 178 C828 124 858 108 884 108 C916 108 934 126 926 178 C920 158 912 146 896 142 C878 150 858 146 846 136 C840 146 836 160 834 178 Z" fill="#1E1A17"/>
  <path d="M846 132 C862 122 890 118 912 130" stroke="#3A322C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- eyebrows -->
  <path d="M858 166 Q866 161 874 165" stroke="#1E1A17" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M886 165 Q894 161 902 166" stroke="#1E1A17" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="866" cy="180" rx="4.5" ry="3.5" fill="#FFFFFF"/>
  <ellipse cx="894" cy="180" rx="4.5" ry="3.5" fill="#FFFFFF"/>
  <circle cx="867" cy="180" r="2.4" fill="#1E1A17"/>
  <circle cx="895" cy="180" r="2.4" fill="#1E1A17"/>

  <!-- nose -->
  <path d="M880 186 Q876 200 880 204 Q884 205 886 203" stroke="#A8724C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M866 214 Q880 224 894 214" stroke="#8A4B2E" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- sleeves -->
  <path d="M800 270 Q782 336 834 348" stroke="#243F5C" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M960 270 Q978 336 926 348" stroke="#2F5F86" stroke-width="30" fill="none" stroke-linecap="round"/>

  <!-- shirt cuffs -->
  <path d="M822 336 L840 330 L844 348 L826 352 Z" fill="#FFFFFF"/>
  <path d="M938 336 L920 330 L916 348 L934 352 Z" fill="#FFFFFF"/>

  <!-- cover letter -->
  <g transform="rotate(3 880 345)">
    <rect x="820" y="282" width="120" height="132" rx="6" fill="url(#paper)" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="820" y="282" width="120" height="16" rx="6" fill="#0F5F57"/>
    <rect x="832" y="306" width="56" height="7" rx="3.5" fill="#0F5F57"/>
    <rect x="832" y="322" width="96" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="832" y="333" width="92" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="832" y="344" width="98" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="832" y="355" width="70" height="4" rx="2" fill="#CBD5E1"/>
    <path d="M832 390 C840 380 846 396 856 386 C862 380 868 392 878 386" stroke="#1B3F5E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="916" cy="388" r="8" fill="none" stroke="#20AA3E" stroke-width="2.5"/>
    <path d="M912 388 L915 391 L921 384" stroke="#20AA3E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- hands -->
  <ellipse cx="834" cy="346" rx="13" ry="12" fill="url(#skin)"/>
  <ellipse cx="926" cy="346" rx="13" ry="12" fill="url(#skin)"/>

  <!-- pen in right hand -->
  <g transform="rotate(35 1010 290)">
    <rect x="996" y="200" width="16" height="110" rx="4" fill="#20AA3E"/>
    <rect x="996" y="214" width="16" height="4" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="996,310 1012,310 1004,330" fill="#FFFFFF"/>
  </g>
</svg>
